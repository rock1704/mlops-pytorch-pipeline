# Default training hyperparameters for the CIFAR-10 classifier.
#
# This file is baked into the training image (docker/Dockerfile.train) and is
# read by src/train.py. In Kubernetes it is overridden by the `training-config`
# ConfigMap, which is mounted over /app/configs (see k8s/configmap.yaml).
#
# Paths are relative so the same file works in all three contexts:
#   - local:  ./data and ./checkpoints in the repo root
#   - docker: /app/data and /app/checkpoints (WORKDIR is /app)

model:
  architecture: resnet18
  num_classes: 10

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3

data:
  dataset: cifar10
  data_dir: data
  # Omit to derive from the device; 0 suits the CPU-only Job.
  num_workers: 0

output:
  checkpoint_dir: checkpoints
  model_name: classifier_v1.pt
