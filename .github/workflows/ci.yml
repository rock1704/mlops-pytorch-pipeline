name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/train.txt
          # dev.txt pulls in serve.txt and pins pytest, ruff and numpy. Every
          # CI-only dependency was previously unpinned, which is how an
          # unannounced ruff rule-set change and a NumPy 2.x ABI break both
          # landed in CI without any change to this repository.
          pip install -r requirements/dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Verify the serving app imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import serve; print(serve.app.title)"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  build-docker-train:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          tags: mlops-train:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-serve:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          push: false
          tags: mlops-serve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
