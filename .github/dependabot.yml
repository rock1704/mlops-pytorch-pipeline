# Keep the pinned dependencies moving.
#
# The workflow pins every action to a commit SHA rather than a tag, which
# removes the mutable-tag risk but also means nothing updates on its own.
# Dependabot is the other half of that trade: it opens PRs with the new SHA
# when an action releases, so the pins stay current instead of rotting.
#
# The same applies to requirements/*.txt, which are fully pinned after the
# unpinned ruff and numpy both broke CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
    open-pull-requests-limit: 5
