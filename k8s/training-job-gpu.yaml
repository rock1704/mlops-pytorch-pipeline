# Bonus: GPU-accelerated training Job.
#
# Identical to k8s/training-job.yaml except that it requests one NVIDIA GPU and
# targets GPU nodes. Apply this INSTEAD OF training-job.yaml on a cluster with
# GPU nodes and the NVIDIA device plugin installed:
#
#   kubectl apply -f k8s/training-job-gpu.yaml
#
# On a local single-node cluster there is no node carrying the
# accelerator=nvidia-gpu label, so this Job's pod stays Pending forever. That
# is why the CPU variant is the default.
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training-gpu
  namespace: ml-training
  labels:
    app: cifar10-trainer
    accelerator: nvidia-gpu
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: cifar10-trainer
        accelerator: nvidia-gpu
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: rock1704/mlops-train:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ml-pipeline-secrets
                optional: true
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: data-volume
              mountPath: /app/data
            - name: checkpoint-volume
              mountPath: /app/checkpoints
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: cifar10-data
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: model-checkpoints
      # Schedule only on GPU nodes, and tolerate the taint they usually carry.
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
