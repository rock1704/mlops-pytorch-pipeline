# Environment-specific credentials for the pipeline.
#
# =====================================================================
#  THE VALUES BELOW ARE PLACEHOLDERS. DO NOT PUT REAL CREDENTIALS HERE.
# =====================================================================
#
# This manifest is committed so the *shape* of the Secret is reviewable and
# reproducible, in the same way configmap.yaml documents the config shape.
# Real values are never committed - .gitignore already excludes .env, *.key
# and secrets/. On a real cluster, create the Secret out-of-band instead:
#
#   kubectl create secret generic ml-pipeline-secrets \
#     --namespace ml-training \
#     --from-literal=DATA_MIRROR_TOKEN="$DATA_MIRROR_TOKEN" \
#     --from-literal=METRICS_API_KEY="$METRICS_API_KEY"
#
# Both the training Job and the serving Deployment consume this Secret via
# `envFrom.secretRef` with `optional: true`, so the pipeline still runs end to
# end on a local cluster where the Secret has not been created.
apiVersion: v1
kind: Secret
metadata:
  name: ml-pipeline-secrets
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
type: Opaque
stringData:
  # Token for an authenticated dataset mirror, read by the training Job.
  DATA_MIRROR_TOKEN: "replace-me-not-a-real-token"
  # Key for pushing run metrics to an experiment tracker.
  METRICS_API_KEY: "replace-me-not-a-real-key"
